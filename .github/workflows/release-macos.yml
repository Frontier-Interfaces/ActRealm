name: Release macOS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: "26.6"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97 --profile minimal
      - name: Select pinned Rust toolchain
        run: rustup default 1.97
      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/actrealm-signing.keychain-db"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 -D > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
      - name: Test and package signed app
        env:
          ACTREALM_SIGN_IDENTITY: ${{ secrets.ACTREALM_SIGN_IDENTITY }}
          ACTREALM_REQUIRE_RELEASE_SIGNING: "1"
          ACTREALM_VERSION: ${{ github.ref_name }}
        run: |
          apps/macos/Scripts/test.sh
          apps/macos/Scripts/package-app.sh apps/macos/release-dist
          codesign --verify --deep --strict --verbose=2 apps/macos/release-dist/ActRealm.app
      - name: Create, notarize, and staple DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          dmg="apps/macos/release-dist/ActRealm-${GITHUB_REF_NAME}.dmg"
          hdiutil create -volname ActRealm -srcfolder apps/macos/release-dist/ActRealm.app -ov -format UDZO "$dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
          spctl --assess --type open --context context:primary-signature -v "$dmg"
          shasum -a 256 "$dmg" > "$dmg.sha256"
      - name: Publish GitHub release
        run: |
          dmg="apps/macos/release-dist/ActRealm-${GITHUB_REF_NAME}.dmg"
          gh release create "$GITHUB_REF_NAME" "$dmg" "$dmg.sha256" --verify-tag --generate-notes
