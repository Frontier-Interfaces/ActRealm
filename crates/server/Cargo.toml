[package]
name = "actrealm-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axum.workspace = true
actrealm-installer = { path = "../installer" }
actrealm-codex-connector = { path = "../codex-connector" }
actrealm-core = { path = "../core" }
actrealm-quota = { path = "../quota" }
actrealm-runtime = { path = "../runtime" }
actrealm-usage = { path = "../usage" }
actrealm-providers = { path = "../providers" }
getrandom.workspace = true
libc.workspace = true
ring.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
axum-server = { version = "=0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
rcgen = { version = "=0.14.8", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
actrealm-bridge = { path = "../bridge" }
futures-util = "0.3"
tokio-tungstenite = "0.29.0"
tower = { version = "0.5", features = ["util"] }
